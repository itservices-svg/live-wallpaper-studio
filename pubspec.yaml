name: live_wallpaper_studio
description: Create live wallpapers and Lock + Home themes from video or photos.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.6.0
  photo_manager_image_provider: ^2.2.0
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  flutter_wallpaper_plus: ^1.1.1
  path_provider: ^2.1.5
  ffmpeg_kit_flutter_new_min_gpl: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
