name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ and pubspec.yaml. Generate the Android
      # project in a scratch folder and copy it in, so lib/ is never touched.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name live_wallpaper_studio --org com.itservices /tmp/scaffold
          if [ ! -d android ]; then cp -r /tmp/scaffold/android ./android; fi

      - name: Add gallery permissions and app name
        run: python3 tools/patch_android.py

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: live-wallpaper-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
