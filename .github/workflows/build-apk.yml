name: Build APK

on:
  push:
    branches: [main, dev-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to 3.41 (Dart 3.11, AGP 8.x template): flutter_wallpaper_plus needs Dart 3.11
      # and its Gradle script does not build with the AGP 9 used by newer templates.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          channel: stable
          cache: true

      # The repo only holds lib/ and pubspec.yaml. Generate the Android
      # project in a scratch folder and copy it in, so lib/ is never touched.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name live_wallpaper_studio --org com.itservices /tmp/scaffold
          if [ ! -d android ]; then cp -r /tmp/scaffold/android ./android; fi

      - name: Add gallery permissions and app name
        run: python3 tools/patch_android.py

      - name: Get packages
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee /tmp/pubget.log
          flutter pub get 2>&1 | tee -a /tmp/pubget.log

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log || true

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee /tmp/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: live-wallpaper-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Keep a single easy-to-find "Latest Android APK" release, updating its APK on each successful build.
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Android APK
          body: |
            Automatically built Android APK.
            Download live-wallpaper-studio.apk below.
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the latest APK on a "builds" branch so it can be fetched without the Actions UI.
      - name: Publish APK to builds branch
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TARGET=builds; else TARGET=builds-dev; fi
          mkdir /tmp/apk && cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/live-wallpaper-studio.apk
          cd /tmp/apk
          git init -q && git checkout -q -b "$TARGET"
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET"

      # Small text logs on a branch, so a failed build can be read without the Actions UI.
      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          mkdir /tmp/logs
          cp /tmp/analyze.log /tmp/logs/analyze.log 2>/dev/null || true
          cp /tmp/pubget.log /tmp/logs/pubget.log 2>/dev/null || true
          tail -n 400 /tmp/build.log > /tmp/logs/build-tail.log 2>/dev/null || true
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TARGET=ci-logs; else TARGET=ci-logs-dev; fi
          cd /tmp/logs
          git init -q && git checkout -q -b "$TARGET"
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "logs for ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET"
